apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bdd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ororck/apps-tp.git
    targetRevision: main
    path: bdd
  destination:
    server: https://kubernetes.default.svc
    namespace: bdd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
